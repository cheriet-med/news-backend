version: '3.8'

services:
  # Redis service for Celery broker
  redis:
    image: redis:7-alpine
    networks:
      - generated_default
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Django application
  django:
    build: .
    networks:
      - generated_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=generated_default"
      # HTTP router - redirects to HTTPS
      - "traefik.http.routers.django-http.rule=Host(`newsapi.padlev.com`)"
      - "traefik.http.routers.django-http.entrypoints=web"
      - "traefik.http.routers.django-http.middlewares=https-redirect"
      # Middleware to redirect HTTP -> HTTPS
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      # HTTPS router
      - "traefik.http.routers.django.rule=Host(`newsapi.padlev.com`)"
      - "traefik.http.routers.django.entrypoints=https"
      - "traefik.http.routers.django.tls=true"
      - "traefik.http.routers.django.tls.certresolver=default"
      # Port Django runs on inside container
      - "traefik.http.services.django.loadbalancer.server.port=8000"
    env_file:
      - .env
    environment:
      - ALLOWED_HOSTS=api.padlev.com,localhost
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - redis
    restart: unless-stopped

  # Celery worker
  celery:
    build: .
    command: celery -A padlevb.celery worker -l info
    networks:
      - generated_default
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./:/app
    depends_on:
      - redis
      - django
    restart: unless-stopped

  # Celery beat (optional - for periodic tasks)
  celery-beat:
    build: .
    command: celery -A padlevb.celery beat -l info
    networks:
      - generated_default
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./:/app
    depends_on:
      - redis
      - django
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
  redis_data:

networks:
  generated_default:
    external: true